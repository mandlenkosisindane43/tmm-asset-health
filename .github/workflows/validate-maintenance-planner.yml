name: Validate maintenance planner staging PR

on:
  pull_request:
    branches:
      - design/modern-light-contractor-dashboard
    paths:
      - 'worker/maintenance-planner.ts'
      - 'worker/router-telemetry-ingestion-v2.ts'
      - '.github/workflows/validate-maintenance-planner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:telemetry
